name: Unpack project
on:
  push:
    paths: ['viridia-upload.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mv viridia-upload.zip /tmp/p.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -q /tmp/p.zip -d .
          git config user.name "joshbiringer"
          git config user.email "joshbiringer@users.noreply.github.com"
          git add -A
          git commit -m "Unpack full project"
          git push
